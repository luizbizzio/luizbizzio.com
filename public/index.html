<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101111">
  <meta name="description" content="Browse websites and open-source projects by Luiz Bizzio.">
  <title>Luiz Bizzio | Websites and Projects</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css?v=base-20261115">
  <link rel="stylesheet" href="./assets/minimal.css?v=stage-pagination-v1">
  <script defer src="./assets/app.js?v=catalog-20261126"></script>
  <script defer src="./assets/explorer.js?v=index-pagination-outside-v2"></script>
  <script defer src="./assets/atlas.js?v=catalog-20261126"></script>
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to work</a>
  <div class="container">
    <header class="header">
      <a class="brand" href="./" aria-label="Luiz Bizzio home">
        <span class="brand-name">Luiz Bizzio</span>
        
      </a>
      <nav class="header-links" aria-label="External links and tools">
        <a class="social-link linkedin-link" href="https://www.linkedin.com/in/luizbizzio/" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profile" title="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="2.2"/><path d="M7.4 10v6.6M7.4 7.5h.01M11.3 16.6V10h3v1.1c.5-.8 1.1-1.2 2.2-1.2 1.8 0 2.2 1.2 2.2 2.8v3.9"/></svg>
          <span class="social-text">LinkedIn</span>
        </a>
        <a class="social-link github-link" href="https://github.com/luizbizzio" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub profile" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.64c.55.1.75-.24.75-.53v-2.1c-3.07.67-3.72-1.3-3.72-1.3-.5-1.27-1.23-1.61-1.23-1.61-1.01-.69.08-.67.08-.67 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.59 1.21 3.22.92.1-.72.39-1.21.7-1.49-2.45-.28-5.03-1.23-5.03-5.47 0-1.21.43-2.2 1.14-2.97-.11-.28-.5-1.4.11-2.92 0 0 .93-.3 3.05 1.14A10.6 10.6 0 0 1 12 6.34c.94 0 1.88.13 2.76.37 2.12-1.44 3.05-1.14 3.05-1.14.61 1.52.22 2.64.11 2.92.71.77 1.14 1.76 1.14 2.97 0 4.25-2.59 5.18-5.05 5.46.4.35.75 1.04.75 2.1v2.99c0 .29.2.63.76.52A11.1 11.1 0 0 0 12 .9Z"/></svg>
          <span class="social-text">GitHub</span>
        </a>
        <span class="email-action">
          <button id="copyEmailButton" type="button" class="social-link email-link" aria-label="Copy contact email" title="Copy email">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><rect x="2.6" y="4.8" width="18.8" height="14.4" rx="2"/><path d="m3.6 6.4 8.4 6.7 8.4-6.7"/></svg>
            <span class="social-text">Email</span>
          </button>
          <span id="emailCopyStatus" class="email-copy-status" role="status" aria-live="polite" aria-atomic="true"></span>
        </span>
        <button id="commandButton" type="button" class="command-trigger" aria-label="Search projects and commands" title="Commands">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.9"/><path d="m16 16 5 5"/></svg>
          <span class="sr-only">Commands</span>
        </button>
      </nav>
    </header>

    <main id="mainContent" tabindex="-1">
      <section class="directory" aria-label="Websites and projects">
        <div class="page-intro"><h1>Index<span aria-hidden="true">.</span></h1></div>

        <div class="collection-navigation">
          <div class="directory-tabs" role="tablist" aria-label="Select collection">
            <button type="button" class="tab active" id="sitesTab" data-tab="sites" role="tab" aria-selected="true" aria-controls="directoryPanel">Websites <span id="sitesCount">08</span></button>
            <button type="button" class="tab" id="projectsTab" data-tab="projects" role="tab" aria-selected="false" aria-controls="directoryPanel">Projects <span id="projectsCount">32</span></button>
          </div>
          <div class="view-switch" role="group" aria-label="View mode">
            <button type="button" id="viewGrid" class="view-switch-button active" aria-pressed="true" title="Browse project images in a grid">
              <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35"><rect x="2" y="2" width="6.5" height="6.5" rx=".5"/><rect x="11.5" y="2" width="6.5" height="6.5" rx=".5"/><rect x="2" y="11.5" width="6.5" height="6.5" rx=".5"/><rect x="11.5" y="11.5" width="6.5" height="6.5" rx=".5"/></svg><span>Grid</span>
            </button>
            <button type="button" id="viewAtlas" class="view-switch-button" aria-pressed="false" title="Interactive 3D view">
              <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35"><circle cx="10" cy="10" r="2.1"/><ellipse cx="10" cy="10" rx="8" ry="4.1" transform="rotate(-28 10 10)"/><ellipse cx="10" cy="10" rx="8" ry="4.1" transform="rotate(32 10 10)"/></svg><span>3D</span>
            </button>
          </div>
        </div>

        <div class="toolbar">
          <div class="search-field">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-width="1.7" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.9"/><path d="m16 16 5 5"/></svg>
            <label for="searchInput" class="sr-only">Search displayed websites or projects</label>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Search..." aria-controls="sitesGrid projectsGrid atlasView">
            <button type="button" id="clearSearch" class="search-clear" aria-label="Clear search" title="Clear search" hidden>×</button>
            <kbd aria-hidden="true">/</kbd>
          </div>
          <div class="selectors">
            <label class="selector">
              <span class="sr-only">Category</span>
              <select id="categorySelect"><option value="All">All categories</option></select>
            </label>
            <label class="selector">
              <span class="sr-only">Sort order</span>
              <select id="sortSelect">
                <option value="featured">Featured</option>
                <option value="name">A to Z</option>
                <option value="recent">Recently updated</option>
              </select>
            </label>
          </div>
        </div>

        <div id="directoryPanel" role="tabpanel" aria-labelledby="sitesTab" tabindex="-1">
          <div id="sitesGrid" class="sites-grid"></div>
          <div id="projectsGrid" class="projects-grid" hidden></div>
          <section id="atlasView" class="atlas-view" hidden aria-label="Explore projects in 3D">
            <div class="atlas-stage" id="atlasStage">
              <div class="atlas-canvas" id="atlasCanvas" role="group" aria-label="3D cards. Swipe, drag, or use the arrow buttons to change projects."></div>
              <div class="atlas-scrim atlas-scrim-left" aria-hidden="true"></div>
              <div class="atlas-scrim atlas-scrim-right" aria-hidden="true"></div>
              <div id="atlasStatus" hidden aria-hidden="true"></div>
              <div id="atlasCount" hidden aria-hidden="true"></div>
              <div id="atlasCollection" hidden aria-hidden="true"></div>
              <div class="atlas-progress" hidden aria-hidden="true"><span id="atlasProgress"></span></div>
            </div>
            <div class="atlas-inspector" id="atlasInspector" aria-live="polite">
              <div class="atlas-next-prev" role="group" aria-label="Navigate projects">
                <button type="button" id="atlasPrev" aria-label="Previous project" title="Previous project"><span aria-hidden="true">←</span></button>
                <span id="atlasSelectedIndex" class="atlas-counter">01 / 08</span>
                <button type="button" id="atlasNext" aria-label="Next project" title="Next project"><span aria-hidden="true">→</span></button>
              </div>
              <div class="atlas-inspector-title-wrap">
                <span class="sr-only" id="atlasCategory">Project</span>
                <div class="atlas-title-identity">
                  <img id="atlasFavicon" alt="" hidden>
                  <span id="atlasIdentityForges" class="atlas-identity-forges" hidden></span>
                  <h3 id="atlasTitle">ScanDeck</h3>
                </div>
                <p id="atlasDescription">Games stored inside scannable codes.</p>
                <div hidden aria-hidden="true"><span id="atlasCreated"></span><span id="atlasUpdated"></span></div>
              </div>
              <div class="atlas-inspector-actions">
                <button type="button" class="atlas-explore" id="atlasExplore">Details</button>
                <a id="atlasVisit" class="atlas-visit" href="#" target="_blank" rel="noopener noreferrer">Open <span aria-hidden="true">↗</span></a>
              </div>
              <div class="atlas-project-chooser">
                <label for="atlasSelect" class="sr-only">Jump to project</label>
                <select id="atlasSelect" aria-label="Jump to project"></select>
              </div>
            </div>
          </section>
          <div class="empty-state" id="emptyState" hidden>
            <p id="emptyMessage">No matching projects.</p>
            <button type="button" id="clearButton">Show all</button>
          </div>
        </div>
        <nav class="atlas-pagination" id="atlasPagination" aria-label="3D gallery navigation" hidden></nav>
      </section>
    </main>
    <footer class="footer">
      <span>© <span id="year">2026</span> Luiz Bizzio</span>
    </footer>
  </div>
  <noscript><p class="no-script-message">JavaScript is required for the interactive gallery. You can still browse the source repositories on <a href="https://github.com/luizbizzio">GitHub</a>.</p></noscript>
  <dialog id="previewDialog" class="detail-dialog" aria-labelledby="previewTitle">
    <div class="detail-top">
      <div class="detail-heading">
        <div class="detail-heading-main">
          <img id="detailIcon" class="detail-icon" alt="" hidden>
          <div>
            <span class="detail-eyebrow" id="previewEyebrow">PROJECT</span>
            <h2 id="previewTitle"></h2>
          </div>
        </div>
      </div>
      <button type="button" class="dialog-dismiss" id="closePreview" aria-label="Close project details">×</button>
    </div>
    <div class="detail-layout">
      <div class="detail-visual-column">
        <div class="detail-visual" id="previewArea"></div>

      </div>
      <aside class="detail-sidebar" aria-label="Project information">
        <p class="detail-description" id="previewDescription"></p>
        <dl class="detail-meta">
          <div><dt>Category</dt><dd id="detailCategory">—</dd></div>
          <div><dt>Created</dt><dd id="detailCreated">—</dd></div>
          <div><dt>Platform</dt><dd id="detailPlatform">—</dd></div>
          <div><dt>Repository</dt><dd id="detailStatus">—</dd></div>
          <div><dt>Latest release</dt><dd id="detailRelease">No release</dd></div>
          <div><dt>Last update</dt><dd id="detailUpdated">—</dd></div>
        </dl>
        <div id="detailLinks" class="detail-links"></div>

      </aside>
    </div>
  </dialog>

  <dialog id="commandDialog" class="command-dialog" aria-label="Search and commands">
    <div class="command-search-row">
      <svg viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" fill="none" stroke-width="1.7"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
      <input id="commandInput" role="combobox" aria-label="Find a project or run a command"
        aria-expanded="true" aria-autocomplete="list" aria-controls="commandResults"
        autocomplete="off" spellcheck="false" placeholder="Find a project or type > for commands">
      <button type="button" id="commandClose" class="command-escape" aria-label="Close command search">ESC</button>
    </div>
    <div id="commandResults" class="command-results" role="listbox" aria-label="Search results"></div>
    <div class="command-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span><kbd>↵</kbd> Select</span>
      <span><kbd>ESC</kbd> Close</span>
    </div>
  </dialog>
</body>
</html>
