name: Capture website previews

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-previews.yml
      - scripts/capture-previews.mjs
      - public/sites.json

permissions:
  contents: write

concurrency:
  group: site-previews
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install --with-deps chromium
      - name: Capture local 3200px website screenshots
        run: node scripts/capture-previews.mjs
      - name: Commit current previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add public/previews/*.jpg
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: update high-resolution website captures"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
